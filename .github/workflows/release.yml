name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w" \
            -o vpn-panel-${{ matrix.os }}-${{ matrix.arch }}${ext} .

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" --title "$TAG" --generate-notes ./vpn-panel-* 2>/dev/null \
              || gh release upload "$TAG" ./vpn-panel-* --clobber
          else
            gh release delete nightly --yes 2>/dev/null || true
            gh release create nightly --title "nightly build" --prerelease \
              --notes "手动触发的最新构建" ./vpn-panel-*
          fi
